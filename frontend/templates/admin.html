<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>K-EMLAK - Yönetim & Analitik Paneli</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 10px; border: none; }
    </style>
</head>
<body class="p-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h3 class="fw-bold mb-0">📊 K-EMLAK Yönetim Paneli</h3>
        <div>
            <a href="/valuation" class="btn btn-outline-primary btn-sm me-2">Değerleme Modülü</a>
            <a href="/listings" class="btn btn-outline-primary btn-sm me-2">İlanlar</a>
            <a href="/admin" class="btn btn-dark btn-sm">Yönetim & Grafikler</a>
        </div>
    </div>

    <!-- İstatistik Kartları -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm bg-white">
                <span class="text-muted">Aktif Toplam İlan</span>
                <h3 class="fw-bold text-primary">{{ total_properties }}</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 shadow-sm bg-white">
                <span class="text-muted">Gerçekleştirilen Değerleme</span>
                <h3 class="fw-bold text-success">{{ total_valuations }}</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 shadow-sm bg-white">
                <span class="text-muted">Kapsanan Şehir</span>
                <h3 class="fw-bold text-dark">1 (İstanbul)</h3>
            </div>
        </div>
    </div>

    <!-- İlçe Ortalama m² Fiyat Grafiği -->
    <div class="card p-4 shadow-sm bg-white">
        <h5 class="fw-bold mb-3">İlçelere Göre Ortalama Metrekare (m²) Fiyatı (TL)</h5>
        <canvas id="districtChart" height="100"></canvas>
    </div>
</div>

<script>
    const labels = {{ chart_labels | tojson }};
    const dataValues = {{ chart_values | tojson }};

    const ctx = document.getElementById('districtChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Ortalama m² Fiyatı (TL)',
                data: dataValues,
                backgroundColor: 'rgba(54, 162, 235, 0.7)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) { return value.toLocaleString('tr-TR') + ' TL'; }
                    }
                }
            }
        }
    });
</script>
</body>
</html>
